<tr>
  <td class="cov-file" data-value="$(File)"><a href="$(Url).html">$(File)</a></td>
  <td class="cov-bar-cell" data-value="$(LinePct)"><span class="cov-bar cov-$(LineLevel)"><span class="cov-bar-fill" style="width: $(LinePct)%"></span></span></td>
  <td class="cov-pct cov-$(LineLevel)" data-value="$(LinePct)">$(LinePct)%</td>
  <td class="cov-count" data-value="$(LineTotal)">$(LineCovered)/$(LineTotal)</td>
  <td class="cov-pct cov-$(BranchLevel)" data-value="$(BranchValue)">$(BranchPct)</td>
  <td class="cov-count" data-value="$(BranchTotal)">$(BranchCount)</td>
</tr>
