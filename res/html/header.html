<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="./css/style.css" rel="stylesheet">
    <link href="./css/highlight.css" rel="stylesheet">

    <title>$(Title)</title>
  </head>
  <body>

    <header class="topbar">
      <button type="button" class="sidebar-toggle" aria-label="Toggle navigation" aria-controls="sidebar">☰</button>
      <a class="brand" href="index.html">$(Title)</a>

      <form id="gotosymbol" class="search" role="search">
        <input type="text" class="search-input" placeholder="Search this page…" autocomplete="off">
        <ul id="search-results" class="search-results" hidden></ul>
      </form>

      <a class="topbar-link" href="$(GitURL)">Source</a>
      <button type="button" class="theme-toggle" aria-label="Toggle theme">☾</button>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar">
        <ul id="module-list-source" hidden>
          $(Modules)
        </ul>

        <section class="sidebar-section">
          <h2>Modules</h2>
          <ul id="module-list" class="tree">
            <noscript>
              $(Modules)
            </noscript>
          </ul>
        </section>

        <section class="sidebar-section" id="symbol-section" hidden>
          <h2>$(Title)</h2>
          <ul id="symbol-list" class="tree"></ul>
        </section>
      </nav>

      <main class="content">
        <nav id="module-breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>

        <div id="declaration-list">
          $(Body)
        </div>
      </main>
    </div><!-- /.layout -->
