name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - name: Compute toolchain build-args from YMIR_VERSION
        id: gyc
        run: |
          . ./YMIR_VERSION
          GCC_MAJOR="${GCC_VERSION%%.*}"
          echo "release_tag=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=gyc-${GCC_MAJOR}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "gyllir_release_tag=${GYLLIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_asset=gyllir_${GYLLIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          push: false
          load: true
          tags: gyllir-build:ci
          build-args: |
            GYC_RELEASE_TAG=${{ steps.gyc.outputs.release_tag }}
            GYC_ASSET=${{ steps.gyc.outputs.asset }}
            GYLLIR_RELEASE_TAG=${{ steps.gyc.outputs.gyllir_release_tag }}
            GYLLIR_ASSET=${{ steps.gyc.outputs.gyllir_asset }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ./gyllir.test is the unittest executable produced by `gyllir test --dry` in the build
      # stage; running it here (rather than letting the `test` stage do it) is what lets the
      # coverage report be captured.
      - name: Run tests and collect coverage
        id: run_tests
        run: |
          set -o pipefail
          docker run --rm gyllir-build:ci ./gyllir.test -sf -cov -j 1 | tee coverage.txt

      - name: Publish coverage summary
        if: always()
        run: |
          CLEAN="$(sed -E 's/\x1b\[[0-9;]*m//g' coverage.txt)"

          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            HEADER_LINE="$(echo "$CLEAN" | grep -n 'COVERAGE' | head -1 | cut -d: -f1)"
            REPORT="$(echo "$CLEAN" | tail -n "+$((HEADER_LINE - 1))")"
            TOTAL_LINE="$(echo "$CLEAN" | grep -E 'TOTAL:' | tail -1)"
            TOTAL_PCT="$(echo "$TOTAL_LINE" | grep -oE '^\[[0-9]+%\]' | tr -d '[]')"
            TOTAL_NUM="${TOTAL_PCT%\%}"

            if [ -z "$TOTAL_NUM" ]; then
              BADGE_COLOR="lightgrey"
              TOTAL_NUM="unknown"
            elif [ "$TOTAL_NUM" -lt 50 ]; then
              BADGE_COLOR="red"
            elif [ "$TOTAL_NUM" -gt 95 ]; then
              BADGE_COLOR="brightgreen"
            else
              BADGE_COLOR="yellow"
            fi

            {
              echo "## Coverage ![coverage](https://img.shields.io/badge/coverage-${TOTAL_NUM}%25-${BADGE_COLOR})"
              echo
              echo '```'
              echo "$REPORT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Tests failed - no coverage report"
              echo
              echo '```'
              echo "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
