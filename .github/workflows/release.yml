name: Release

# Manual: builds and publishes gyllir_<VERSION>_amd64.deb as a GitHub release asset. The tag
# is v<gyllirVersion>, read from the root VERSION file - bump it (bump-patch/minor/major.yml)
# before dispatching this again for a new release. Fails instead of overwriting if the target
# version has already been released; see release-preview.yml for a replaceable rolling build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute versions and tag name
        id: version
        run: |
          . ./YMIR_VERSION
          GYLLIR_VERSION="$(tr -d '[:space:]' < VERSION)"
          YMIR_SHORT_VERSION="$(echo "$YMIR_BOOTSTRAP_VERSION" | cut -d. -f1,2)"
          TAG_NAME="v${GYLLIR_VERSION}"
          echo "gyllir_version=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ymir_bootstrap_version=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gcc_version=${GCC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=v${YMIR_SHORT_VERSION}_gyc_${GCC_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Ensure this version has not already been released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists - bump VERSION before releasing again."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin (with no matching release) - bump VERSION before releasing again."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      # Same `package` stage the CI workflow builds on top of `test`: compiles gyllir, runs
      # gyllir_tests -sf (failing the job if anything regressed), then stages the install +
      # DEBIAN/control into a .deb.
      - name: Build, test, and package
        uses: docker/build-push-action@v7
        with:
          context: .
          target: package
          push: false
          load: true
          tags: gyllir-release-build:latest
          build-args: |
            GYC_RELEASE_TAG=${{ steps.version.outputs.ymir_bootstrap_version }}
            GYC_ASSET=${{ steps.version.outputs.gyc_asset }}
            GYLLIR_VERSION_NUMBER=${{ steps.version.outputs.gyllir_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract .deb
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
          GYLLIR_VERSION: ${{ steps.version.outputs.gyllir_version }}
        run: |
          CID="$(docker create gyllir-release-build:latest)"
          docker cp "${CID}:/gyllir_${GYLLIR_VERSION}_amd64.deb" "./gyllir_${TAG}_amd64.deb"
          docker rm "${CID}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
          GYLLIR_VERSION: ${{ steps.version.outputs.gyllir_version }}
          YMIR_BOOTSTRAP_VERSION: ${{ steps.version.outputs.ymir_bootstrap_version }}
          GCC_VERSION: ${{ steps.version.outputs.gcc_version }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Release $TAG" \
            --notes "Gyllir ${GYLLIR_VERSION}, built against ymir bootstrap ${YMIR_BOOTSTRAP_VERSION} (gcc ${GCC_VERSION}) @ ${{ github.sha }}." \
            "gyllir_${TAG}_amd64.deb"
