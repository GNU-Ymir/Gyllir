name: Preview Release

# Rolling pre-release, manually triggered (pick the branch/ref from the "Run workflow" button).
# The tag/release name is the constant `preview`, independent of the package version: every run replaces the
# previous preview, so there is only ever one preview tag and one preview release. The asset name
# is constant too (gyllir_preview_amd64.deb), which keeps the download URL stable across runs. The
# name cannot collide with release.yml's bare <gyllirVersion> tags.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-release:
    runs-on: [self-hosted, linux, x64]
    steps:
      # fetch-depth: 0 so the changelog step below has the history and the tags it walks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The self-hosted runners have no gh CLI of their own; the release steps below need one.
      - uses: ./.github/actions/setup-gh

      - name: Compute versions and tag name
        id: version
        run: |
          . ./YMIR_VERSION
          GYLLIR_VERSION="$(bash .github/scripts/gyllir-version.sh)"
          GCC_MAJOR="${GCC_VERSION%%.*}"
          echo "gyllir_version=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_release_tag=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "gyllir_release_tag=${GYLLIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyllir_asset=gyllir_${GYLLIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "tag_name=preview" >> "$GITHUB_OUTPUT"

      # The preview body. The base is the last real release, never the previous preview: the
      # `preview` tag is rolling (and deleted below), so diffing against it would be meaningless.
      - name: Build release notes
        env:
          GYLLIR_VERSION: ${{ steps.version.outputs.gyllir_version }}
        run: |
          set -euo pipefail

          BASE="$(bash .github/scripts/changelog.sh --print-base)"

          {
            echo "Automated preview release of gyllir ${GYLLIR_VERSION}, built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA}."
            echo "This tag is rolling - it always points at the most recent preview build."
            echo
            if [ -n "$BASE" ]; then
              echo "## What's changed since ${BASE}"
            else
              echo "## What's changed"
            fi
            echo
            bash .github/scripts/changelog.sh --since "$BASE"
            if [ -n "$BASE" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${BASE}...${GITHUB_SHA}"
            fi
          } > "${RUNNER_TEMP}/release-notes.md"

          cat "${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      # Same `package` stage the CI workflow builds on top of `test`: compiles gyllir with a
      # released gyllir, runs ./gyllir.test -sf (failing the job if anything regressed), then
      # stages the install + DEBIAN/control into a .deb.
      - name: Build, test, and package
        uses: docker/build-push-action@v7
        with:
          context: .
          target: package
          push: false
          load: true
          tags: gyllir-preview-build:latest
          build-args: |
            GYC_RELEASE_TAG=${{ steps.version.outputs.gyc_release_tag }}
            GYC_ASSET=${{ steps.version.outputs.gyc_asset }}
            GYLLIR_RELEASE_TAG=${{ steps.version.outputs.gyllir_release_tag }}
            GYLLIR_ASSET=${{ steps.version.outputs.gyllir_asset }}
            GYLLIR_VERSION_NUMBER=${{ steps.version.outputs.gyllir_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract .deb
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
          GYLLIR_VERSION: ${{ steps.version.outputs.gyllir_version }}
        run: |
          CID="$(docker create gyllir-preview-build:latest)"
          docker cp "${CID}:/gyllir_${GYLLIR_VERSION}_amd64.deb" "./gyllir_${TAG}_amd64.deb"
          docker rm "${CID}"

      - name: Replace existing preview tag/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
          GYLLIR_VERSION: ${{ steps.version.outputs.gyllir_version }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Preview (gyllir ${GYLLIR_VERSION})" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --prerelease \
            "gyllir_${TAG}_amd64.deb"
