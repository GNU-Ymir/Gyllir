name: Preview Release

# Rolling pre-release, manually triggered (pick the branch/ref from the "Run workflow" button).
# The tag/release name is the constant `preview`, independent of VERSION: every run replaces the
# previous preview, so there is only ever one preview tag and one preview release. The asset name
# is constant too (gyllir_preview_amd64.deb), which keeps the download URL stable across runs. The
# name cannot collide with release.yml's bare <gyllirVersion> tags.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute versions and tag name
        id: version
        run: |
          . ./YMIR_VERSION
          GYLLIR_VERSION="$(tr -d '[:space:]' < VERSION)"
          GCC_MAJOR="${GCC_VERSION%%.*}"
          echo "gyllir_version=${GYLLIR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_release_tag=${YMIR_BOOTSTRAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gyc_asset=gyc-${GCC_MAJOR}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "tag_name=preview" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Same `package` stage the CI workflow builds on top of `test`: compiles gyllir, runs
      # gyllir_tests -sf (failing the job if anything regressed), then stages the install +
      # DEBIAN/control into a .deb.
      - name: Build, test, and package
        uses: docker/build-push-action@v7
        with:
          context: .
          target: package
          push: false
          load: true
          tags: gyllir-preview-build:latest
          build-args: |
            GYC_RELEASE_TAG=${{ steps.version.outputs.gyc_release_tag }}
            GYC_ASSET=${{ steps.version.outputs.gyc_asset }}
            GYLLIR_VERSION_NUMBER=${{ steps.version.outputs.gyllir_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract .deb
        env:
          TAG: ${{ steps.version.outputs.tag_name }}
          GYLLIR_VERSION: ${{ steps.version.outputs.gyllir_version }}
        run: |
          CID="$(docker create gyllir-preview-build:latest)"
          docker cp "${CID}:/gyllir_${GYLLIR_VERSION}_amd64.deb" "./gyllir_${TAG}_amd64.deb"
          docker rm "${CID}"

      - name: Replace existing preview tag/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
        run: gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag_name }}
          GYLLIR_VERSION: ${{ steps.version.outputs.gyllir_version }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Preview (gyllir ${GYLLIR_VERSION})" \
            --notes "Automated preview release of gyllir ${GYLLIR_VERSION}, built @ ${{ github.sha }}. This tag is rolling - it always points at the most recent preview build." \
            --prerelease \
            "gyllir_${TAG}_amd64.deb"
