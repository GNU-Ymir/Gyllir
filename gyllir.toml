compiler = "gyc"
license = "GPL-v3"
authors = ["Emile Cadorel <ecadorel@gmail.com>"]
libraries = []
type = "executable"
description = "Ymir package manager, and builder"
version = "1.5.0"
name = "gyllir"
# Needed until a released gyllir binary picks up this fix: the currently installed bootstrap
# toolchain still resolves the default root by package name first, so it picks src/gyllir.yr
# (matching the package name) over src/main.yr without this override.
package-root = "main"

[dependencies]

[registry]
git = "git@github.com:GNU-Ymir/Gyllir.git"

[commands]
set-version = { cmd = "./tools/set-version.sh", post = false }
