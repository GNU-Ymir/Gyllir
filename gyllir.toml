compiler = "gyc"
license = "GPL-v3"
author = "Emile Cadorel <ecadorel@gmail.com>"
libraries = []
type = "executable"
description = "Ymir package manager, and builder"
version = "1.4.0"
name = "gyllir"
# Without this, src/gyllir.yr (matching the package name) is picked as the package root and
# src/main.yr is left unattached, so the executable links with no `main`.
package-root = "main"

[dependencies]

[registry]
git = "git@github.com:GNU-Ymir/Gyllir.git"

[commands]
set-version = { cmd = "./tools/set-version.sh", post = false }
